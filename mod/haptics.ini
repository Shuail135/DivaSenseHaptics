# DivaSenseHaptics configuration
# Restart Mega Mix+ after changing this file.

[audio]
enabled = true
# Music/bass haptics are independent of UI/gameplay validation.
music_gain = 0.32
# Overall strength after music + gameplay effects mixed
master_gain = 0.62
highpass_hz = 35
lowpass_hz = 220
softclip_drive = 1.35
endpoint_contains = Wireless Controller
max_buffered_ms = 55
target_buffered_ms = 18

[controller]
enabled = true
force_audio_haptics = true
unmute_interval_ms = 40

[input]
enabled = true
# Physical input supplies direction/touch/hold context only. When the song DSC is
# available, the chart itself supplies exact note/multi/slide identity after DIVA confirms it.
multi_window_ms = 14
hold_start_ms = 115
slide_window_ms = 18
chain_start_ms = 85
stick_threshold = 72
touch_swipe_pixels = 90

sticks_as_slides = true
shoulders_as_slides = true
touchpad_as_slides = true
# In gameplay D-pad directions map to DIVA face notes. Outside gameplay they are
# menu navigation candidates instead.
dpad_as_face_buttons = true


[effects]
# These defaults work automatically; edit only if you want to fine-tune feel.
single_gain = 0.54
multi_gain = 0.75
# Exact chord count is taken from simultaneous TARGET commands in the loaded DSC chart.
# Physical/button timing is only a fallback if chart capture/locking is unavailable.
multi_2_multiplier = 1.00
multi_3_multiplier = 1.66
multi_4_multiplier = 2.30
slide_gain = 0.85
hold_gain = 0.20
chain_gain = 0.13
# Pulse speed of a confirmed long/chain slide.
chain_frequency_hz = 22.0
# Extra two-stage pulse for DIVA's exact isSuccessNote (Chance/Success rainbow note).
success_note_gain = 1.10
challenge_gain = 1.00
challenge_note_multiplier = 1.52

[judgement]
enabled = true
# Strict validation: invalid/dead gameplay presses and loading-screen input are silent.
strict_validation = true
# 0 = no raw press preview. The main note feedback occurs on DIVA's judgement.
press_preview_gain = 0.00

cool_gain = 1.00
fine_gain = 0.82
safe_gain = 0.58
sad_gain = 0.38
wrong_gain = 0.32
worst_gain = 0.10
overlay_gain = 0.42

match_window_ms = 180
pending_timeout_ms = 240
gameplay_poll_timeout_ms = 250
# Judgement callbacks inside this tiny window are treated as one simultaneous chord.
multi_group_window_ms = 6
# Fine-tuning only: widen this if your controller/game threads are unusually far apart.
physical_multi_window_ms = 24
# DIVA per-target checks can occur just before/after COOL/FINE/etc.; correlate them here.
target_correlation_window_ms = 12
log_events = false

[menu]
# Menu presses are candidates only. A haptic is emitted after the rendered menu
# visibly reacts, suppressing dead presses and most loading/transition input.
enabled = true
nav_gain = 0.56
confirm_gain = 0.88
# Default PC/Steam confirm is Cross/A. Can be square, cross, circle, or triangle.
confirm_button = cross
left_right_navigation = true
stick_navigation = true

validation_window_ms = 120
sample_interval_ms = 16
settle_ms = 80
# Pre-input screen motion must stay under this threshold for settle_ms. Animated
# loading/transition scenes therefore do not qualify as menu interaction states.
settle_max_delta = 0.0045
nav_min_delta = 0.0035
confirm_min_delta = 0.0060
motion_factor = 2.15
motion_margin = 0.0015
max_baseline_motion = 0.020
log_events = false

[challenge]
# Challenge Time is encoded by the chart itself, but this build does not yet hook
# the chart MODE_SELECT command directly. The older black-bar detector is only a
# visual heuristic and can false-positive on PV transitions, so it is OFF by default.
# Keep enabled=true for Challenge effects, but leave visual_detection=false for safe use.
enabled = true
visual_detection = false
sample_interval_ms = 160
dark_threshold = 0.055
center_minimum = 0.085
contrast_minimum = 0.040
enter_samples = 3
exit_samples = 4
