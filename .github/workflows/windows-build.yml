name: Windows x64 build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File .\scripts\package.ps1 -Configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: DivaSenseHaptics-Windows-x64
          path: dist/DivaSenseHaptics-v0.1.0-Release.zip
